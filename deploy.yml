name: اختبار وبناء ونشر المنصة

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# إلغاء أي عملية قديمة عالقة عند بدء عملية جديدة (يمنع تكدّس الطابور)
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # ===== بناء الواجهة =====
  build:
    name: بناء الواجهة
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: تثبيت الحزم
        run: npm ci

      - name: بناء الواجهة
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_SENDER_ID: ${{ secrets.VITE_FIREBASE_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_AI_ENDPOINT: ${{ secrets.VITE_AI_ENDPOINT }}
          VITE_ANTHROPIC_KEY: ${{ secrets.VITE_ANTHROPIC_KEY }}
        run: npm run build

      - name: تجهيز المخرجات
        run: |
          test -f dist/index.html || { echo "::error::لم تُبنَ الواجهة"; exit 1; }
          grep -q "firebaseapp.com" dist/assets/*.js || echo "::warning::تحقق من أسرار Firebase في إعدادات المستودع"
          cp dist/index.html dist/404.html   # لتعمل الروابط المباشرة على GitHub Pages
          echo "✅ البناء سليم" && du -sh dist

      - name: رفع المخرجات لـ Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # ===== النشر على GitHub Pages =====
  deploy:
    name: النشر على GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - name: النشر
        id: pages
        uses: actions/deploy-pages@v4
