name: تمرين الاستعادة (شهري)

# v49.1 — MQ-171: يأخذ أحدث نسخة ليلية مشفّرة ويستعيدها كاملة في محاكي Firestore (لا يلمس الإنتاج أبدًا)،
# ثم يقرأها ويطابقها بصمةً ببصمة مع النسخة، ويتحقق من توازن الدفاتر ومطابقة السجلات المحمية. فشل أي خطوة ⇒ بريد تنبيه.
on:
  schedule:
    - cron: '41 1 3 * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  drill:
    name: استعادة أحدث نسخة في المحاكي ومطابقتها
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - run: npm ci
      - name: تنزيل أحدث نسخة ليلية ناجحة
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN=$(gh run list --workflow nightly-backup.yml --status success --limit 1 --json databaseId -q '.[0].databaseId')
          if [ -z "$RUN" ]; then echo "::error::لا نسخة ليلية ناجحة"; exit 1; fi
          gh run download "$RUN" --dir drill
          echo "BACKUP_FILE=$(ls drill/*/*.enc | head -1)" >> "$GITHUB_ENV"
      - name: الاستعادة في المحاكي والمطابقة
        env:
          BACKUP_KEY: ${{ secrets.BACKUP_KEY }}
          REQUIRE_EMULATOR: '1'
        run: npx firebase emulators:exec --only firestore --project restore-drill "node scripts/restore-drill.mjs"
      - name: حذف الملفات
        if: always()
        run: rm -rf drill restore-drill.json
