name: نشر قواعد أمان Firestore

on:
  push:
    branches: [main]
    paths: ['firestore.rules']
  workflow_dispatch:

jobs:
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: تجهيز اعتماد الخدمة
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA" ]; then
            echo "::warning::لم يُضبط FIREBASE_SERVICE_ACCOUNT — انشر القواعد يدوياً من لوحة Firebase."
            exit 0
          fi
          echo "$SA" > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> $GITHUB_ENV
      - name: نشر القواعد
        if: env.GOOGLE_APPLICATION_CREDENTIALS != ''
        run: npx --yes firebase-tools@13 deploy --only firestore:rules --project "${{ secrets.VITE_FIREBASE_PROJECT_ID }}"
