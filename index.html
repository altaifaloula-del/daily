<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#14110F" />
    <title>منصة سحابية متكاملة لإدارة وإغلاق فروع المطاعم</title>
    <meta name="description" content="إغلاق يومي، ضبط نقدي، خزينة رئيسية، رواتب وسلف، موردون، وتقارير مالية سحابية متعددة المستخدمين." />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="icon.svg" />
    <link rel="apple-touch-icon" href="icon.svg" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="إغلاق الفروع" />
  </head>
  <body style="margin:0;background:#14110F">
    <div id="root"></div>
    <script type="module" src="/main.jsx"></script>
    <script>
      // إزالة عامل الخدمة نهائياً ومسح كل الكاش — شفاء ذاتي لأي جهاز عالق على نسخة قديمة
      (function () {
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function (regs) {
            var had = regs.length > 0;
            regs.forEach(function (r) { r.unregister(); });
            if ('caches' in window) {
              caches.keys().then(function (keys) {
                return Promise.all(keys.map(function (k) { return caches.delete(k); }));
              }).then(function () {
                // إن كان هناك عامل خدمة قديم، أعد التحميل مرة واحدة لعرض النسخة النظيفة
                if (had && !sessionStorage.getItem('sw_purged')) {
                  sessionStorage.setItem('sw_purged', '1');
                  location.reload();
                }
              });
            } else if (had && !sessionStorage.getItem('sw_purged')) {
              sessionStorage.setItem('sw_purged', '1');
              location.reload();
            }
          }).catch(function () {});
        }
      })();
    </script>
  </body>
</html>
