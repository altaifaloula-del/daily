    <!-- v47.2: أيقونة التطبيق على الأجهزة = العلامة المعتمدة (أسماء ملفات جديدة حتى تتجدد عند الأجهزة التي حفظت القديمة) -->

  <body style="margin:0;background:#14110F">
    <div id="root"></div>
    <script type="module" src="/main.jsx"></script>
    <script>
      // إزالة عامل الخدمة نهائياً ومسح كل الكاش — شفاء ذاتي لأي جهاز عالق على نسخة قديمة
      (function () {
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function (regs) {
            // v45.9: عامل إشعارات الإغلاق (push-sw.js) يبقى — لا كاش فيه ولا يتحكم في الصفحات
            var isPush = function (r) { var w = r.active || r.waiting || r.installing; return !!(w && /push-sw\.js$/.test(w.scriptURL)); };
            regs = regs.filter(function (r) { return !isPush(r); });
            var had = regs.length > 0;
            regs.forEach(function (r) { r.unregister(); });
            if ('caches' in window) {
              caches.keys().then(function (keys) {
                return Promise.all(keys.map(function (k) { return caches.delete(k); }));
              }).then(function () {
                // إن كان هناك عامل خدمة قديم، أعد التحميل مرة واحدة لعرض النسخة النظيفة
                if (had && !sessionStorage.getItem('sw_purged')) {
                  sessionStorage.setItem('sw_purged', '1');
                  location.reload();
                }
              });
            } else if (had && !sessionStorage.getItem('sw_purged')) {
              sessionStorage.setItem('sw_purged', '1');
              location.reload();
            }
          }).catch(function () {});
        }
      })();
    </script>
  </body>
