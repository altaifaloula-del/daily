# خادم وسيط الذكاء الاصطناعي فقط — الواجهة تُنشر على GitHub Pages
services:
  - type: web
    name: mizan-ai
    runtime: node
    plan: free            # المجانية تنام بعد 15 دقيقة خمول (أول طلب بعدها يتأخر ~دقيقة). غيّرها إلى starter لإلغاء ذلك
    buildCommand: npm install --omit=dev
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: NODE_ENV
        value: production
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: FIREBASE_API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        value: https://altaifaloula-del.github.io
